name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Windows PowerShell helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'native/windows-native.ps1'
          [void][ScriptBlock]::Create((Get-Content -Raw $path))
          Write-Host "PowerShell parser validation passed."

      - name: Validate Linux AT-SPI helper
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile native/linux-atspi.py
          python3 -m py_compile native/linux-wayland.py 2>/dev/null || true

      - name: Windows UI Automation smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File native/windows-uia-smoke.ps1

      - name: Validate macOS AX helper
        if: runner.os == 'macOS'
        run: swiftc -typecheck native/macos-ax.swift
